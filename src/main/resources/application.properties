spring.application.name=projeto

# 1. Configurações de Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/projeto
spring.datasource.username=root
spring.datasource.password=

# 2. Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update

# Define o dialeto correto para o MySQL moderno
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Console e Logs (Opcional - Útil para Desenvolvimento)
spring.jpa.show-sql=true

# Formata o SQL do console para ficar mais fácil de ler
spring.jpa.properties.hibernate.format_sql=true
